name: Update Snooker
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python snooker_model.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: auto V5
          file_pattern: docs/index.html ratings_auto.json
