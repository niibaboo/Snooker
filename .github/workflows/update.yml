name: Update Snooker
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python snooker_model.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add docs/index.html ratings_auto.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto update V5" && git push)
