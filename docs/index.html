<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snooker IQ V2 LIVE</title>
<style>
 body{background:#08120c;color:#eafff0;font-family:-apple-system,sans-serif;margin:0;padding:16px}
 h1{text-align:center;font-size:22px;margin-top:28px}
 .sub{text-align:center;opacity:.6;font-size:12px;margin:8px 0 18px;line-height:1.4}
 .card{background:#12261a;border:1px solid #1e4a2f;border-radius:16px;max-width:580px;margin:0 auto 14px;overflow:hidden}
 .head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #1e4a2f;font-weight:800;font-size:13px}
 .live{background:#00ff88;color:#05220f;padding:5px 11px;border-radius:20px;font-size:10px;font-weight:800}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th{opacity:.5;font-size:10px;text-align:left;padding:7px 10px}
 td{padding:9px 10px;border-top:1px solid #1a3524}
 input{background:#0a1a12;border:1px solid #234a32;color:#fff;border-radius:6px;padding:5px 6px;width:50px;text-align:center;font-size:12px}
 .edge{color:#00ff88;font-weight:800}
 .neg{color:#ff6b6b;font-weight:800}
 .foot{text-align:center;opacity:.35;font-size:11px;margin-top:18px}
 .small{font-size:11px;opacity:.5;text-align:center;margin-top:8px}
</style>
</head><body>
<h1>🎱 Snooker IQ V2 LIVE</h1>
<div class="sub">English Open 2026 — Last 32 — Built <span id="time"></span> — LIVE Today<br>Enter True% + Bet365 → EDGE auto-calculates</div>

<div class="card">
 <div class="head"><span>Morning Session 10am BST — Today</span><span class="live">LIVE TODAY</span></div>
 <table id="tbl">
  <tr><th>Match</th><th>True%</th><th>Bet365</th><th>EDGE</th></tr>
 </table>
</div>
<div class="small">Tip: Type your model % and Bet365 price. Green = BET. Red = No bet.</div>
<div class="foot"><a href="https://niibaboo.github.io/" style="color:#00ff88;text-decoration:none">← Back to niibaboo.lab Hub</a></div>

<script>
const matches=[
 "Ding Junhui vs Ashley Hugill",
 "Zhang Anda vs Mark Selby",
 "Chang Bingyu vs Kyren Wilson",
 "Judd Trump vs Ashley Carty",
 "Oliver Lines vs Yuan Sijun",
 "Chris Wakelin vs Zhou Yuelong",
 "Sam Craigie vs Joe O'Connor",
 "Barry Hawkins vs Daniel Wells"
];
const tbl=document.getElementById('tbl');
matches.forEach((m,i)=>{
 tbl.innerHTML+=`<tr><td style="font-size:12px">${m}</td><td><input id="t${i}" placeholder="%" oninput="calc(${i})"></td><td><input id="b${i}" placeholder="odd" oninput="calc(${i})"></td><td id="e${i}" class="edge">--</td></tr>`;
});
function calc(i){
 let t=parseFloat(document.getElementById('t'+i).value);
 let b=parseFloat(document.getElementById('b'+i).value);
 if(!t||!b){document.getElementById('e'+i).innerText='--';return}
 let implied=100/b;
 let edge=t-implied;
 let el=document.getElementById('e'+i);
 el.innerText=(edge>0?'+':'')+edge.toFixed(1)+'%';
 el.className=edge>2?'edge':'neg';
}
document.getElementById('time').innerText=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'})+' BST';
</script>
</body></html>
