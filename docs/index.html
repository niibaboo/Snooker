<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>V6.4 Real Form</title><style>*{box-sizing:border-box}body{font-family:sans-serif;background:#0f1115;color:#e8e8e8;margin:0;padding:12px}
.match{background:#1a1e27;border-radius:12px;padding:14px;margin:12px 0;border:1px solid #2a2f3d}.fair{color:#7fb8ff;font-weight:600}
input{width:70px;background:#0f1115;border:1px solid #3a4152;color:#fff;border-radius:6px;padding:6px;text-align:center}
.value{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px}.val-yes{background:#00c853;color:#000}.val-no{background:#2a2f3d;color:#888}.val-big{background:#ffd600;color:#000}
.grid{display:grid;grid-template-columns:1fr 60px 60px 110px;gap:6px;font-size:13px;align-items:center}</style></head><body>
<h1>💥 V6.4 REAL FORM</h1><div id="app"></div><script>
const RATINGS={"Judd Trump":1965,"Mark Selby":1895,"Mark Williams":1860,"Kyren Wilson":1845,"Ding Junhui":1825,"Barry Hawkins":1795,"Ali Carter":1770,"Joe O'Connor":1735,"Zhou Yuelong":1710,"Wu Yize":1705,"Yuan Sijun":1695,"Anthony McGill":1685,"Gong Chenzhi":1580,"Liam Davies":1520};
const FIXTURES=[["Mark Selby","Kyren Wilson"],["Yuan Sijun","Zhou Yuelong"],["Joe O'Connor","Ding Junhui"],["Liam Davies","Wu Yize"],["Ali Carter","Gong Chenzhi"],["Judd Trump","Anthony McGill"],["Mark Williams","Barry Hawkins"]];
function winProb(r1,r2){return 1/(1+Math.pow(10,(r2-r1)/400));}
function render(){let h='';FIXTURES.forEach(([p1,p2],i)=>{const r1=RATINGS[p1]||1600,r2=RATINGS[p2]||1600;const p1m=winProb(r1,r2),p2m=1-p1m;h+=`<div class=match><b>${p1} (${(p1m*100).toFixed(1)}%) vs ${p2} (${(p2m*100).toFixed(1)}%)</b><div class=grid><div></div><div>%</div><div>Fair</div><div>B365 → Value</div></div><div class=grid><div>${p1} Race to 4</div><div>${(p1m*100).toFixed(1)}%</div><div class=fair>${(1/p1m).toFixed(2)}</div><div><input id=b-${i}-0 oninput=chk(${i},0,${p1m}) placeholder=1.61><span id=v-${i}-0></span></div></div><div class=grid><div>${p2} Race to 4</div><div>${(p2m*100).toFixed(1)}%</div><div class=fair>${(1/p2m).toFixed(2)}</div><div><input id=b-${i}-1 oninput=chk(${i},1,${p2m}) placeholder=2.30><span id=v-${i}-1></span></div></div></div>`});document.getElementById('app').innerHTML=h;}
function chk(mi,mk,fp){const fo=1/fp;const inp=document.getElementById(`b-${mi}-${mk}`);const out=document.getElementById(`v-${mi}-${mk}`);const b=parseFloat(inp.value);if(!b){out.textContent='';return;}const e=(b/fo-1)*100;out.textContent=e>2?`VALUE +${e.toFixed(1)}%`:`NO VALUE ${e.toFixed(1)}%`;out.className=e>8?'val-yes':e>2?'val-big':'val-no';}
render();</script></body></html>
